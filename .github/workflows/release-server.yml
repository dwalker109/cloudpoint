name: Release server image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_IMG: dwalker109/cloudpoint
  GHCR_IMG: ghcr.io/dwalker109/cloudpoint

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          echo "version=$(
            cargo +stable metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "cloudpoint_server").version'
          )" >> "$GITHUB_OUTPUT"

  build-amd64:
    uses: ./.github/workflows/build-server.yml
    with:
      platform: linux/amd64
      runner: ubuntu-26.04
    secrets: inherit

  build-arm64:
    uses: ./.github/workflows/build-server.yml
    with:
      platform: linux/arm64
      runner: ubuntu-26.04-arm
    secrets: inherit

  merge:
    needs: [version, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest lists and push
        run: |
          for img in ${{ env.DOCKERHUB_IMG }} ${{ env.GHCR_IMG }}; do
            docker buildx imagetools create \
              -t "$img:${{ needs.version.outputs.version }}" \
              -t "$img:latest" \
              "$img@${{ needs.build-amd64.outputs.digest }}" \
              "$img@${{ needs.build-arm64.outputs.digest }}"
          done

      - run: |
          docker buildx imagetools inspect ${{ env.DOCKERHUB_IMG }}:latest
          docker buildx imagetools inspect ${{ env.GHCR_IMG }}:latest
