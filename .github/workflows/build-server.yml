name: Build server image

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      runner:
        type: string
        required: true
    outputs:
      digest:
        value: ${{ jobs.build.outputs.digest }}

env:
  DOCKERHUB_IMG: dwalker109/cloudpoint
  GHCR_IMG: ghcr.io/dwalker109/cloudpoint

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CHUNKTREE_DEPLOY_KEY }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cloudpoint_server/Dockerfile
          platforms: ${{ inputs.platform }}
          ssh: default
          outputs: type=image,"name=${{ env.DOCKERHUB_IMG }},${{ env.GHCR_IMG }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ inputs.platform }}
          cache-to: type=gha,mode=max,scope=${{ inputs.platform }}
