name: Release app binary & CIA

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    permissions:
      contents: write

    steps:
      - name: Install Git LFS for devkitpro container
        run: apt-get update && apt-get install -y git-lfs

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup release environment
        uses: ./.github/actions/setup
        with:
          ssh-private-key: ${{ secrets.CHUNKTREE_DEPLOY_KEY }}

      - name: Build 3DSX and CIA
        env:
          TAG: ${{ github.event.release.tag_name }}
          SUFFIX: ${{ github.event.release.prerelease && '-pre' || '' }}
        run: just cia "$TAG$SUFFIX"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/armv6k-nintendo-3ds/release/cloudpoint.3dsx
            cloudpoint_app/cia/cloudpoint.cia
          generate_release_notes: false
